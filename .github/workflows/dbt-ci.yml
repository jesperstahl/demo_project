python-version: '3.12'

- name: Install dbt (Postgres adapter)
  run: |
    dbt --version
    dbt debug || true
    dbt build
  working-directory: .

- name: Upload dbt artifacts (logs + target)
  if: always()
  uses: actions/upload-artifact@v4
  with:
    name: dbt-artifacts
    path: |
      logs
      target

